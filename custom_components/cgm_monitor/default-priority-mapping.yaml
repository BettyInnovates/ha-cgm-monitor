# TODO check for best default values

# state:
# - critical_low
# - very_low
# - low
# - ok
# - high
# - very_high

# trend:
# - falling_quickly: falling more than 3 mg/dl each minute
# - falling: falling 2-3 mg/dl each minute
# - falling_slightly: falling 1-2 mg/dl each minute
# - steady: changing less than 1 mg/dl each minute
# - rising_slightly: rising 1-2 mg/dl each minute
# - rising: rising 2-3 mg/dl each minute
# - rising_quickly: rising more than 3 mg/dl each minute

# priority:
# - warning
# - critical

priority_mapping:
  - state: "critical_low"
    trend: "falling_quickly"
    priority: "critical"
  - state: "critical_low"
    trend: "falling_slightly"
    priority: "critical"
  - state: "critical_low"
    trend: "falling"
    priority: "critical"
  - state: "critical_low"
    trend: "steady"
    priority: "critical"
  - state: "critical_low"
    trend: "rising_slightly"
    priority: "warning"
  - state: "critical_low"
    trend: "rising"
    priority: "warning"

  - state: "very_low"
    trend: "falling_quickly"
    priority: "critical"
  - state: "very_low"
    trend: "falling_slightly"
    priority: "warning"
  - state: "very_low"
    trend: "falling"
    priority: "critical"
  - state: "very_low"
    trend: "steady"
    priority: "warning"

  - state: "low"
    trend: "falling_quickly"
    priority: "critical"
  - state: "low"
    trend: "falling_slightly"
    priority: "warning"
  - state: "low"
    trend: "falling"
    priority: "warning"

  - state: "high"
    trend: "rising_quickly"
    priority: "critical"
  - state: "high"
    trend: "rising_slightly"
    priority: "warning"
  - state: "high"
    trend: "rising"
    priority: "warning"

  - state: "very_high"
    trend: "rising_quickly"
    priority: "critical"
  - state: "very_high"
    trend: "rising_slightly"
    priority: "warning"
  - state: "very_high"
    trend: "rising"
    priority: "warning"
